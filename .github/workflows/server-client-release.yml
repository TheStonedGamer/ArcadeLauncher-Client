name: Server Client Release

# Builds and publishes the server-client MSI from this repo's main branch.
on:
  push:
    branches: [main]
    tags:
      - "client-v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

# The JS actions below still declare the Node 20 runtime, which GitHub
# force-deprecates 2026-06-16. Opt every action into Node 24 now (the
# documented migration switch) so releases keep working past that date.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build & Package Server Client
    runs-on: windows-latest
    if: github.ref_type == 'tag' || github.actor != 'github-actions[bot]'
    outputs:
      VERSION: ${{ steps.ver.outputs.VERSION }}
      TAG: ${{ steps.ver.outputs.TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump client version
        id: ver
        shell: pwsh
        run: |
          $author = git log -1 --format='%an'
          $isTag  = '${{ github.ref_type }}' -eq 'tag'
          $isBot  = $author -eq 'github-actions[bot]'

          $txt   = Get-Content src\Version.h -Raw
          $major = [int][regex]::Match($txt, '#define ARCADE_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $minor = [int][regex]::Match($txt, '#define ARCADE_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $patch = [int][regex]::Match($txt, '#define ARCADE_VERSION_PATCH\s+(\d+)').Groups[1].Value

          Write-Host "Current version : $major.$minor.$patch"
          Write-Host "Triggered by tag: $isTag   Bot commit: $isBot"

          if (-not $isTag -and -not $isBot) {
            $msg = git log -1 --format='%s'
            Write-Host "Commit message  : $msg"
            if ($msg -match '\[major\]') {
              $major++; $minor = 0; $patch = 0
              Write-Host "Bump type       : MAJOR"
            } elseif ($msg -match '\[minor\]') {
              $minor++; $patch = 0
              Write-Host "Bump type       : MINOR"
            } else {
              $patch++
              Write-Host "Bump type       : PATCH"
            }

            $txt = $txt -replace '(#define ARCADE_VERSION_MAJOR\s+)\d+', "`${1}$major"
            $txt = $txt -replace '(#define ARCADE_VERSION_MINOR\s+)\d+', "`${1}$minor"
            $txt = $txt -replace '(#define ARCADE_VERSION_PATCH\s+)\d+', "`${1}$patch"
            $txt = $txt -replace '(#define ARCADE_VERSION_BUILD\s+)\d+', "`${1}0"
            Set-Content src\Version.h $txt -NoNewline

            git add src/Version.h
            git commit -m "chore: bump server client version to $major.$minor.$patch [skip actions]"
            git push origin HEAD:main
          }

          $ver = "$major.$minor.$patch"
          $tag = "client-v$ver"
          Write-Host "Client release version : $ver   Tag: $tag"
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          "TAG=$tag"     >> $env:GITHUB_OUTPUT

      - name: Ensure client release tag
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          git tag -f "${{ steps.ver.outputs.TAG }}"
          git push -f origin "${{ steps.ver.outputs.TAG }}"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET for WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install WiX v4
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5 --global

      - name: Build Release
        run: |
          msbuild ArcadeLauncher-Client.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m /nologo `
            /p:TreatWarningsAsErrors=false

      - name: Create dist directory
        run: New-Item -ItemType Directory -Force dist

      - name: Build MSI
        run: |
          wix build installer\ArcadeLauncher.wxs `
            -ext WixToolset.UI.wixext `
            -d "BinDir=bin\Release" `
            -d "ProductVersion=${{ steps.ver.outputs.VERSION }}" `
            -out "dist\ArcadeLauncher-Server-Client-x64.msi" `
            -arch x64

      - name: Copy client executable artifact
        run: Copy-Item bin\Release\ArcadeLauncher.exe dist\ArcadeLauncher-Server-Client.exe -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeLauncher-Server-Client-${{ steps.ver.outputs.TAG }}
          path: |
            dist\ArcadeLauncher-Server-Client-x64.msi
            dist\ArcadeLauncher-Server-Client.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: ArcadeLauncher Server Client ${{ steps.ver.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ArcadeLauncher-Server-Client-x64.msi
            dist/ArcadeLauncher-Server-Client.exe

  # ── Linux client ────────────────────────────────────────────────────────────
  # Builds the native Linux client via CMake and attaches a Linux artifact to the
  # SAME release/tag the Windows job created. Runs against that tag so both
  # platforms ship the identical version (see PORTING_LINUX.md §8 — the Linux
  # client tracks the Windows client in lockstep once the port is complete).
  #
  # Port status: today CMake produces the portable core + headless self-checks
  # (no GUI yet). The tarball therefore currently holds those binaries; as the
  # port lands the SDL2 app (L3) and AppImage packaging (L7), this job's build/
  # package steps grow into them and the release artifact becomes the real
  # runnable Linux client — no pipeline rewiring needed.
  build-linux:
    name: Build & Package Linux Client
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag' || github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # Build the exact commit the Windows job tagged, so versions match.
          ref: ${{ needs.build.outputs.TAG }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libcurl4-openssl-dev \
            libssl-dev zlib1g-dev \
            libsdl2-dev libgl1-mesa-dev libgl1-mesa-dri xvfb \
            libglew-dev fonts-dejavu-core
          # libssl-dev/zlib1g-dev: TLS + compression for IXWebSocket (L2b).
          # libsdl2-dev/mesa/xvfb: SDL2 window + software GL for the L3 GUI checks.
          # libglew-dev: GL3 loader for the nanovg Renderer2D (L3b).
          # fonts-dejavu-core: default TTF the renderer loads for text.
          # Further L3+ deps as impls land: libfontconfig1-dev libasound2-dev

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Portable-core self-check (gate)
        run: ./build/core_selfcheck

      - name: Image-codec self-check (gate)
        run: ./build/image_selfcheck

      - name: Catalog-parse self-check (gate)
        run: ./build/catalog_selfcheck

      - name: Grid-layout self-check (gate)
        run: ./build/grid_selfcheck

      - name: Grid-controller self-check (gate)
        run: ./build/grid_controller_selfcheck

      - name: ROM-variant self-check (gate)
        run: ./build/variants_selfcheck

      - name: Net self-check (best-effort — needs server reachable)
        continue-on-error: true
        run: ./build/net_selfcheck

      - name: GUI checks under xvfb (first pixels + nanovg catalog grid, software GL)
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          xvfb-run -a -s "-screen 0 1280x800x24" ./build/gui_smoke
          xvfb-run -a -s "-screen 0 1280x800x24" ./build/gui_demo

      - name: Package Linux artifact
        run: |
          VER="${{ needs.build.outputs.VERSION }}"
          STAGE="ArcadeLauncher-Linux-x64-${VER}"
          mkdir -p "dist/${STAGE}"
          # Ship every built executable; today that's the headless self-checks,
          # tomorrow the GUI client binary + AppImage land here too.
          find build -maxdepth 1 -type f -executable -exec cp {} "dist/${STAGE}/" \;
          cp PORTING_LINUX.md "dist/${STAGE}/" || true
          tar -C dist -czf "dist/ArcadeLauncher-Linux-x64.tar.gz" "${STAGE}"
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeLauncher-Linux-${{ needs.build.outputs.TAG }}
          path: dist/ArcadeLauncher-Linux-x64.tar.gz

      - name: Attach Linux artifact to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.TAG }}
          files: dist/ArcadeLauncher-Linux-x64.tar.gz
